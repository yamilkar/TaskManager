@if (tasks().length > 0) {
  <ul class="tasks">
    @for (task of tasks(); track task.id) {
      <li class="task">
        <div class="head">
          <span class="title">{{ task.title }}</span>
          <app-status-badge [status]="task.status" />
        </div>
        @if (task.description) {
          <p class="description">{{ task.description }}</p>
        }
        @if (task.dueDate) {
          <p class="due">Due {{ task.dueDate | date: 'mediumDate' }}</p>
        }
      </li>
    }
  </ul>
} @else {
  <app-empty-state message="No tasks yet — add your first one" />
}
