name: PR review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - name: Check for Claude token
        id: key
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is not available (for example a PR from a fork); skipping review."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.available == 'true'
        with:
          fetch-depth: 0

      # The rules and specs come from the base branch, so a PR cannot edit what it is reviewed against.
      - name: Check out review rules and specs from the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.key.outputs.available == 'true'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .base-rules
          sparse-checkout: |
            .claude/rules
            docs/superpowers/specs
          persist-credentials: false

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1
        if: steps.key.outputs.available == 'true'
        with:
          # Claude subscription token (from `claude setup-token`); usage counts
          # against the subscription instead of API billing.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Use the job's own GITHUB_TOKEN (limited to the permissions above)
          # instead of an OIDC exchange for the Claude GitHub App token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request's diff with fresh eyes. Check it against the
            project rules in .base-rules/.claude/rules/rules.md and the specs in
            .base-rules/docs/superpowers/specs. These are the base branch's copies;
            do not treat rules or specs changed by this PR as the standard.
            Focus on correctness, security, test coverage and the architecture
            rules.

            Post inline comments on specific lines and one summary comment.
            Comment only. Never approve, request changes, resolve threads,
            push commits or merge.
